<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Поиск гида</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(180deg, #f0f4f8 0%, #e8eef5 100%);
    color: #1a1d2e;
    min-height: 100vh;
    font-size: 15px;
    line-height: 1.4;
  }
  body { padding: 20px 16px 40px; max-width: 500px; margin: 0 auto; }
  .header {
    text-align: center;
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 20px;
    color: #1a1d2e;
  }
  .search-box {
    position: relative;
    margin-bottom: 12px;
  }
  .search-input {
    width: 100%;
    padding: 16px 18px 16px 48px;
    border: none;
    border-radius: 14px;
    background: #fff;
    font-size: 16px;
    color: #1a1d2e;
    outline: none;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    transition: box-shadow 0.2s;
  }
  .search-input:focus {
    box-shadow: 0 4px 14px rgba(34,150,100,0.15);
  }
  .search-icon {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 20px;
    opacity: 0.5;
  }
  .btn {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(135deg, #5fb08c 0%, #3d8a66 100%);
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    margin-bottom: 20px;
    box-shadow: 0 4px 14px rgba(61,138,102,0.35);
    transition: transform 0.1s, box-shadow 0.2s;
  }
  .btn:active {
    transform: scale(0.98);
    box-shadow: 0 2px 8px rgba(61,138,102,0.25);
  }
  .btn:disabled { opacity: 0.6; }
  .status {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 20px 0;
    color: #6b7280;
    font-size: 14px;
  }
  .loader {
    width: 18px; height: 18px;
    border: 2px solid #d1d5db;
    border-top-color: #3d8a66;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .count-badge {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 16px;
    background: #fff;
    border-radius: 12px;
    font-size: 14px;
    color: #6b7280;
    margin-bottom: 14px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.04);
  }
  .count-badge .icon { font-size: 16px; }
  .count-badge strong { color: #1a1d2e; font-weight: 700; }
  .card {
    background: #fff;
    border-radius: 14px;
    padding: 16px 18px;
    margin-bottom: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    transition: transform 0.1s;
  }
  .card:active {
    transform: scale(0.99);
  }
  .card-location {
    display: flex;
    align-items: center;
    gap: 6px;
    font-weight: 700;
    font-size: 15px;
    color: #1a1d2e;
    margin-bottom: 8px;
  }
  .card-location .pin { font-size: 14px; }
  .card-name {
    font-weight: 500;
    font-size: 15px;
    color: #1a1d2e;
    margin: 6px 0 4px;
  }
  .card-contact {
    display: flex;
    align-items: flex-start;
    gap: 6px;
    color: #3d8a66;
    font-size: 14px;
    margin: 6px 0;
    word-break: break-word;
    font-weight: 500;
  }
  .card-contact a {
    color: #3d8a66;
    text-decoration: none;
  }
  .card-desc {
    color: #6b7280;
    font-size: 13px;
    margin-top: 8px;
    line-height: 1.5;
    padding-top: 8px;
    border-top: 1px solid #f0f2f5;
  }
  .empty {
    text-align: center;
    color: #6b7280;
    padding: 60px 20px;
    font-size: 15px;
  }
  .empty .icon { font-size: 48px; display: block; margin-bottom: 12px; opacity: 0.5; }
  .error {
    background: #fee;
    color: #c00;
    padding: 12px 16px;
    border-radius: 12px;
    font-size: 14px;
    margin-bottom: 12px;
  }
</style>
</head>
<body>
  <div class="header">🗺 Поиск гида</div>
  <div class="search-box">
    <span class="search-icon">🔍</span>
    <input type="text" class="search-input" id="q" placeholder="Страна, город или имя гида" autocomplete="off">
  </div>
  <button class="btn" id="searchBtn">Найти гида</button>
  <div id="results"></div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
  document.body.style.background = tg.themeParams.bg_color || document.body.style.background;
}

const qInput = document.getElementById('q');
const searchBtn = document.getElementById('searchBtn');
const results = document.getElementById('results');

async function search() {
  const query = qInput.value.trim();
  if (!query) return;
  results.innerHTML = '<div class="status"><div class="loader"></div>Ищу...</div>';
  searchBtn.disabled = true;
  try {
    const resp = await fetch('/api/guides/search?q=' + encodeURIComponent(query));
    const data = await resp.json();
    if (data.error && !data.results?.length) {
      results.innerHTML = '<div class="error">' + escapeHtml(data.error) + '</div>';
      return;
    }
    if (!data.results || data.results.length === 0) {
      results.innerHTML = `<div class="empty"><span class="icon">🔍</span>По запросу «${escapeHtml(query)}»<br>ничего не найдено</div>`;
    } else {
      let html = `<div class="count-badge"><span class="icon">🗂</span>Найдено: <strong>${data.results.length}</strong></div>`;
      for (const g of data.results) {
        html += '<div class="card">';
        const loc = (g.country || '—') + (g.city ? ', ' + g.city : '');
        html += '<div class="card-location"><span class="pin">📍</span>' + escapeHtml(loc) + '</div>';
        if (g.name) html += '<div class="card-name">' + escapeHtml(g.name) + '</div>';
        if (g.contacts) {
          const contactsWithLinks = linkifyContacts(g.contacts);
          html += '<div class="card-contact"><span>📞</span><span>' + contactsWithLinks + '</span></div>';
        }
        if (g.desc) html += '<div class="card-desc">' + escapeHtml(g.desc) + '</div>';
        html += '</div>';
      }
      results.innerHTML = html;
    }
  } catch (e) {
    results.innerHTML = '<div class="error">Ошибка: ' + escapeHtml(e.message) + '</div>';
  } finally {
    searchBtn.disabled = false;
  }
}

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function linkifyContacts(s) {
  // Делаем телефоны и ссылки кликабельными
  let text = escapeHtml(s);
  // URL
  text = text.replace(/(https?:\/\/[^\s,]+)/g, '<a href="$1" target="_blank">$1</a>');
  // Telegram @username
  text = text.replace(/(^|\s)@([a-zA-Z0-9_]{4,})/g, '$1<a href="https://telegram.me/$2" target="_blank">@$2</a>');
  // Телефоны (+... или 8...)
  text = text.replace(/(\+?\d[\d\s\-()]{7,}\d)/g, '<a href="tel:$1">$1</a>');
  return text;
}

searchBtn.addEventListener('click', search);
qInput.addEventListener('keydown', e => { if (e.key === 'Enter') search(); });
qInput.focus();
</script>
</body>
</html>
